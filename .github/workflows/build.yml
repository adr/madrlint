name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust library
        run: |
          if [ -d "app/native/rust" ]; then
            cd app/native/rust
          elif [ -d "rust" ]; then
            cd rust
          fi
          cargo build --release
          
      - name: Upload compiled binary
        uses: actions/upload-artifact@v4
        with:
          name: liblychee-linux
          path: |
            app/native/rust/target/release/liblychee.so
            rust/target/release/liblychee.so
          if-no-files-found: error

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build --stacktrace
